<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="443" viewBox="0 0 1000 443" role="img"><style>.sh{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#e6edf3}.ft{font:600 15px system-ui,sans-serif;fill:#e6edf3}.fd{font:13px system-ui,sans-serif;fill:#8b949e}</style><rect x="0.5" y="0.5" width="999" height="442" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="48" class="sh">What I Do</text><rect x="40" y="74" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="84" class="ft">Self-serve platforms &amp; DevX</text><text x="64" y="106" class="fd">Golden paths, paved roads and internal tooling that let teams ship without filing tickets.</text><rect x="40" y="131" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="141" class="ft">AI / LLMOps platform</text><text x="64" y="163" class="fd">LiteLLM as the org's AI gateway — any team gets model access in one MR, with a spending ceiling</text><text x="64" y="182" class="fd">and usage visible on the bill.</text><rect x="40" y="207" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="217" class="ft">Reliability &amp; observability</text><text x="64" y="239" class="fd">When something breaks, I follow it from infrastructure down into application and library code —</text><text x="64" y="258" class="fd">Prometheus, Grafana, ELK, Istio, OpenTelemetry.</text><rect x="40" y="283" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="293" class="ft">Multi-cloud &amp; IaC</text><text x="64" y="315" class="fd">Terraform, Terragrunt and Ansible across GCP and AWS — including ~10 TB of production ClickHouse</text><text x="64" y="334" class="fd">moved from GCP to AWS.</text><rect x="40" y="359" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="369" class="ft">FinOps &amp; efficiency</text><text x="64" y="391" class="fd">Cost measured, attributed to the teams that spend it, and cut with demand-driven scaling (KEDA,</text><text x="64" y="410" class="fd">Karpenter) — ~$100k/year saved in the last year.</text></svg>