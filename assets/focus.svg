<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="386" viewBox="0 0 1000 386" role="img"><style>.sh{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#e6edf3}.ft{font:600 15px system-ui,sans-serif;fill:#e6edf3}.fd{font:13px system-ui,sans-serif;fill:#8b949e}</style><rect x="0.5" y="0.5" width="999" height="385" rx="12" fill="#0d1117" stroke="#30363d"/><text x="40" y="48" class="sh">What I Do</text><rect x="40" y="74" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="84" class="ft">Self-serve platforms &amp; DevX</text><text x="64" y="106" class="fd">Golden paths, paved roads and internal tooling that let teams ship without filing tickets.</text><rect x="40" y="131" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="141" class="ft">AI / LLMOps platform</text><text x="64" y="163" class="fd">LiteLLM, MCP and inference plumbing — turning LLM experiments into reliable platform</text><text x="64" y="182" class="fd">capabilities.</text><rect x="40" y="207" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="217" class="ft">Reliability &amp; observability</text><text x="64" y="239" class="fd">Prometheus, Grafana, ELK and Istio for SLO-driven operations and low MTTR.</text><rect x="40" y="264" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="274" class="ft">Multi-cloud &amp; IaC</text><text x="64" y="296" class="fd">Terraform and Ansible across AWS and beyond, including large-scale platform migrations.</text><rect x="40" y="321" width="10" height="10" rx="2.5" fill="#3fb950"/><text x="64" y="331" class="ft">FinOps &amp; efficiency</text><text x="64" y="353" class="fd">Karpenter and dynamic provisioning for cost-aware, cloud-native infrastructure.</text></svg>